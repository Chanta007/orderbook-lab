name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and e2e
        run: |
          sudo apt-get update -y
          sudo apt-get install -y g++ make python3
          make test
          make e2e
